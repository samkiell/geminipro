# Render blueprint for the bot (free web service). Secrets have sync: false: set them in the
# Render dashboard, never here. See README "Deploy" and docs/ARCHITECTURE.md section 10.
services:
  - type: web
    name: geminipro
    runtime: node
    plan: free
    region: frankfurt
    # --prod=false: the build needs TypeScript (a devDependency) whatever a pnpm version makes of NODE_ENV=production.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    # Applies pending migrations, then boots the server.
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: geminiprosamkiel_bot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: BACHS_SECRET_KEY
        sync: false
      - key: BACHS_WEBHOOK_SECRET
        sync: false
      - key: BACHS_BASE_URL
        sync: false
      - key: GROSS_UP
        value: "false"
      - key: FEE_PCT
        value: "0.02"
      - key: FEE_FLAT
        value: "0"
      - key: RESELLER_API_KEY
        sync: false
      - key: RESELLER_PRODUCT_ID
        value: "1"
      # true with a sk_sandbox_ key (mock links, no real money), false with sk_live_. The app refuses any other pair.
      - key: RESELLER_MOCK
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        value: qwen/qwen3.8-27b,openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: LLM_CONCURRENCY
        value: "6"
      - key: DATABASE_URL
        sync: false
      - key: UNIT_PRICE_NGN
        value: "3500"
      - key: MAX_QTY_PER_ORDER
        value: "10"
      - key: LOW_BALANCE_ORDERS
        value: "5"
      - key: SUPPORT_WHATSAPP_INTL
        value: "2348087357158"
      - key: REMINDER_DELAY_MINUTES
        value: "180"
      - key: ALERT_EMAIL
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: SALES_CUTOFF
        sync: false
